[project]
name = "resolve-harness"
version = "0.1.0"
description = "A minimal Python AI agent harness: LangGraph loop + LiteLLM routing + layered memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
resolve-harness-chat = "resolve_harness.cli:chat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
