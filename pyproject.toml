[project]
name = "agentpulse"
version = "0.1.0"
description = "A minimal Python AI agent harness: LangGraph loop + LiteLLM routing + layered memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "litellm>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agentpulse-chat = "agentpulse.cli:chat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# PyPI mirror for China networks; remove these lines if you're outside China.
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
